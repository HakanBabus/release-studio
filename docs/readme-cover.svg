<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 520" role="img" aria-labelledby="title description">
  <title id="title">Release Studio — Give every release its moment</title>
  <desc id="description">A warm editorial banner with a sample release card, showing how Release Studio turns notes into a polished shareable design.</desc>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#cec8bd" />
    </pattern>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#2c2459" flood-opacity="0.14" />
    </filter>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2eeff" />
      <stop offset="1" stop-color="#e8e4fb" />
    </linearGradient>
  </defs>

  <rect width="1280" height="520" rx="30" fill="#fbf8f2" />
  <circle cx="1030" cy="270" r="300" fill="url(#wash)" />
  <rect x="660" y="35" width="585" height="440" fill="url(#dots)" opacity="0.45" />
  <path d="M0 438c160-45 292-31 438 82H0z" fill="#f2eee5" />
  <circle cx="1210" cy="64" r="7" fill="#e8785d" />
  <circle cx="1180" cy="91" r="4" fill="#5b4acb" />
  <path d="m1158 58 7 13 7-13-7-13z" fill="#8c7ce2" />

  <g transform="translate(76 62)" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
    <rect width="44" height="44" rx="15" fill="#5b4acb" />
    <path d="m22 8 14 14-14 14L8 22 22 8Z" fill="none" stroke="#fff" stroke-width="2.5" />
    <path d="m16 22 4 4 8-9" fill="none" stroke="#e6ff96" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.8" />
    <text x="60" y="29" fill="#342e4d" font-size="15" font-weight="750" letter-spacing="2.1">RELEASE STUDIO</text>
    <rect x="363" y="5" width="142" height="32" rx="16" fill="#eeebf9" />
    <circle cx="381" cy="21" r="4" fill="#5b4acb" />
    <text x="393" y="26" fill="#514b68" font-size="11" font-weight="700" letter-spacing="1">FREE · OPEN SOURCE</text>

    <text x="0" y="143" fill="#2c2840" font-size="55" font-weight="760" letter-spacing="-2.7">Give every release</text>
    <text x="0" y="207" fill="#5b4acb" font-size="55" font-weight="760" letter-spacing="-2.7">its moment.</text>
    <text x="2" y="256" fill="#696477" font-size="18" font-weight="450">Turn the notes you already wrote into a launch card</text>
    <text x="2" y="283" fill="#696477" font-size="18" font-weight="450">people will actually stop to read.</text>

    <g transform="translate(0 326)">
      <rect width="158" height="42" rx="21" fill="#fff" stroke="#e9e4da" />
      <path d="m19 15 5 5 5-5m-5 5v8" fill="none" stroke="#5b4acb" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" />
      <text x="40" y="26" fill="#454052" font-size="13" font-weight="650">16 original layouts</text>
      <rect x="170" width="117" height="42" rx="21" fill="#fff" stroke="#e9e4da" />
      <rect x="187" y="12" width="18" height="18" rx="5" fill="#e6ff96" />
      <text x="215" y="26" fill="#454052" font-size="13" font-weight="650">PNG + SVG</text>
      <rect x="299" width="151" height="42" rx="21" fill="#fff" stroke="#e9e4da" />
      <path d="M318 14v14m-6-8 6-6 6 6" fill="none" stroke="#5b4acb" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" />
      <text x="335" y="26" fill="#454052" font-size="13" font-weight="650">Private by default</text>
    </g>

    <text x="2" y="424" fill="#736d84" font-size="12" font-weight="600" letter-spacing="0.3">NO ACCOUNT  ·  NO UPLOADS  ·  JUST A GOOD-LOOKING RELEASE</text>
  </g>

  <g transform="translate(700 90)">
    <g transform="rotate(8 244 170)" opacity="0.72">
      <rect x="71" y="39" width="396" height="297" rx="28" fill="#796bd0" />
      <path d="M116 104h190m-190 25h130m-130 25h166" stroke="#d9d3ff" stroke-linecap="round" stroke-width="9" />
      <circle cx="414" cy="87" r="20" fill="#e6ff96" />
      <path d="m407 87 5 5 10-11" fill="none" stroke="#4e4780" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" />
    </g>

    <g filter="url(#shadow)">
      <rect x="29" y="28" width="440" height="334" rx="29" fill="#fff" />
      <circle cx="69" cy="72" r="17" fill="#e6ff96" />
      <path d="m69 62 10 10-10 10-10-10 10-10z" fill="none" stroke="#5546b5" stroke-width="1.8" />
      <text x="98" y="77" fill="#343044" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="730" letter-spacing="1.1">NORTHSTAR</text>
      <rect x="369" y="55" width="70" height="30" rx="15" fill="#f2efff" />
      <text x="384" y="75" fill="#5b4acb" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="700">v2.4.0</text>
      <text x="61" y="137" fill="#7c70ce" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" font-weight="750" letter-spacing="2">JUST SHIPPED</text>
      <text x="61" y="193" fill="#282538" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="38" font-weight="760" letter-spacing="-1.8">Better, by</text>
      <text x="61" y="238" fill="#282538" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="38" font-weight="760" letter-spacing="-1.8">design.</text>
      <path d="M66 273h9m-9 18h9m-9 18h9" stroke="#5b4acb" stroke-linecap="round" stroke-width="4" />
      <path d="M85 273h132m-132 18h102m-102 18h148" stroke="#d7d3df" stroke-linecap="round" stroke-width="5" />
      <rect x="61" y="322" width="112" height="24" rx="12" fill="#f3f0ff" />
      <text x="75" y="338" fill="#5b4acb" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" font-weight="700">3 NEW THINGS</text>
      <rect x="181" y="322" width="132" height="24" rx="12" fill="#f5f3ee" />
      <text x="196" y="338" fill="#5f5a68" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" font-weight="700">READY TO SHARE</text>
    </g>

    <g transform="translate(410 345) rotate(-8)">
      <rect width="83" height="52" rx="17" fill="#e6ff96" stroke="#d5eb8a" />
      <path d="M22 18h39v21H22z" fill="none" stroke="#495433" stroke-linejoin="round" stroke-width="2" />
      <path d="M31 30h21m-21 5h12" stroke="#495433" stroke-linecap="round" stroke-width="2" />
      <text x="28" y="50" fill="#495433" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="8" font-weight="800" letter-spacing="1">PNG · SVG</text>
    </g>
    <path d="m17 35 8 14 8-14-8-14z" fill="#e8785d" />
    <circle cx="493" cy="170" r="7" fill="#5b4acb" />
    <path d="m497 223 5 8 9 1-7 6 2 9-9-5-8 5 2-9-7-6 9-1z" fill="#f2b84b" />
  </g>
</svg>
